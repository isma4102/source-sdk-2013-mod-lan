// The engine runs this file when a listen server starts, after server.cfg.
// It must not contain a "map" command: that would reload the level.
//
// sv_lan is read as the server comes up. Also tick LAN in the create-server
// dialog before hosting, so the second PC can see the game on the LAN tab.
hostname "Supervivencia Paysandu"
sv_lan 1
exec survival_coop
echo "Supervivencia Paysandu: coop, necesidades, infeccion, ruido y revivir."
