// Cliente de Sanducero. El motor lo ejecuta al arrancar.
// Si cambias una tecla en el menu, este archivo la pisa al proximo inicio:
// edita la linea o borrala.
con_enable 1
bind F10 toggleconsole
bind i survival_inv
bind g survival_eat
bind h survival_drink
bind j survival_give
bind n survival_antidote
bind k survival_horn

cl_survival_radar 1
cl_survival_radar_range 1500
cl_survival_ambient 1
cl_survival_ambient_volume 0.35
cl_survival_ambient_gap 18
