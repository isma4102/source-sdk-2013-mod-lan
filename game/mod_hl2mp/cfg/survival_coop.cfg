// Listen-server defaults for the Paysandu survival co-op test.
// From the game console, after the map is loaded: exec survival_coop
//
// sv_lan is an engine setting. Set it before hosting if the menu does not:
//   sv_lan 1

sv_survival_coop 1
mp_friendlyfire 0
mp_timelimit 0
mp_fraglimit 0
sv_survival_needs_enabled 1
sv_survival_hunger_rate 0.05
sv_survival_thirst_rate 0.08
sv_survival_stamina_regen 8
sv_survival_stamina_drain_sprint 12
sv_survival_stamina_sprint_min 1
sv_survival_empty_damage 2
sv_survival_empty_damage_interval 1
