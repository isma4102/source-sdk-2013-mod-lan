// Paysandu survival co-op. cfg/listenserver.cfg runs this on a listen server.
// Manual fallback, after the map is loaded: exec survival_coop
//
// sv_lan is an engine setting. Set it before hosting if the menu does not:
//   sv_lan 1

sv_survival_coop 1
mp_friendlyfire 0
mp_timelimit 0
mp_fraglimit 0
sv_survival_needs_enabled 1
sv_survival_hunger_rate 0.04
sv_survival_thirst_rate 0.07
sv_survival_stamina_regen 10
sv_survival_stamina_regen_starving 0
sv_survival_stamina_drain_sprint 12
sv_survival_stamina_sprint_min 1
sv_survival_hunger_damage 2
sv_survival_thirst_damage 3
sv_survival_empty_damage 0
sv_survival_empty_damage_interval 1

// Realistic small arms only. 0 restores the HL2MP sci-fi set.
// Kept: pistol, 357, smg1 (+ grenade), shotgun, crowbar, frag.
// Removed from spawn, give and default loadout: physcannon, physgun,
// ar2, energy ball, rpg, crossbow, stunstick, slam, bugbait.
sv_survival_realistic_weapons 1

// 720 real seconds is one 24h cycle. The clock starts at 08:00.
// Sleep (survival_bed, or sv_cheats 1; survival_sleep) fills stamina
// and restores this much hunger and thirst. From 20:00 to 07:00 it
// jumps the clock to 07:00.
sv_survival_day_length 720
sv_survival_sleep_restore 20

// Mordida. 0.35 es la chance por golpe de zombie. La infección sube
// sv_survival_infect_rate puntos por segundo y al llegar a 100 mata.
// No se conserva al reaparecer.
sv_survival_infect_chance 0.35
sv_survival_infect_rate 1
sv_survival_infect_damage 1
sv_survival_infect_damage_interval 3
sv_survival_infect_clear_on_respawn 1

// Ruido. Sprint, disparos, cajas y +use despiertan zombis en ese radio.
// De 20:00 a 06:00 el radio se multiplica. El cooldown evita un pulso por frame.
sv_survival_noise_enabled 1
sv_survival_noise_cooldown 0.75
sv_survival_noise_radius_sprint 480
sv_survival_noise_radius_gun 900
sv_survival_noise_radius_crate 420
sv_survival_noise_radius_use 280
sv_survival_noise_night_mul 1.5

// El primer golpe letal deja al jugador herido. Un compañero mantiene E
// para revivir. Si se acaba el tiempo, muere de verdad y reaparece con
// hambre, sed y stamina en 100.
sv_survival_downed_enabled 1
sv_survival_downed_time 25
sv_survival_downed_speed 45
sv_survival_revive_time 3
sv_survival_revive_range 96
sv_survival_revive_health 30
